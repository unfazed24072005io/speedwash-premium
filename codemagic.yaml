workflows:
  speedwash-android:
    name: SpeedWash APK
    environment:
      groups:
        - firebase_credentials
      flutter: "3.22.0"
    
    scripts:
      - name: Disable analytics
        script: |
          flutter config --no-analytics
      
      - name: Create fresh Flutter project
        script: |
          echo "🔄 Creating fresh Flutter project..."
          
          # Save our main.dart
          cp lib/main.dart /tmp/main.dart
          
          # Create fresh project
          flutter create --template app --org com.speedwash --platforms android .
          
          # Restore our code
          cp /tmp/main.dart lib/main.dart
          
          echo "✅ Fresh project created"
      
      - name: Setup Firebase
        script: |
          echo "🔥 Setting up Firebase..."
          echo $FIREBASE_CONFIG | base64 --decode > android/app/google-services.json
      
      - name: Install minimal dependencies
        script: |
          echo "📦 Installing dependencies..."
          flutter pub get
      
      - name: Build APK
        script: |
          echo "🏗️ Building APK..."
          flutter build apk --release --no-shrink
          
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "✅ APK BUILT SUCCESSFULLY!"
            echo "📱 APK location: build/app/outputs/flutter-apk/app-release.apk"
            echo "📊 APK size: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)"
          else
            echo "❌ APK not found!"
            find . -name "*.apk" -type f
          fi
    
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
