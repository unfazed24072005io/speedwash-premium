workflows:
  speedwash-android:
    name: SpeedWash Android APK
    environment:
      groups:
        - firebase_credentials
      vars:
        PACKAGE_NAME: "com.speedwash.premium"
      flutter: stable
    scripts:
      - name: Setup Firebase
        script: |
          mkdir -p android/app
          echo $FIREBASE_CONFIG | base64 --decode > android/app/google-services.json
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build APK (legacy project)
        script: |
          flutter build apk \
            --release \
            --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
