workflows:
  speedwash-android:
    name: SpeedWash APK
    environment:
      groups:
        - firebase_credentials
      flutter: "3.22.0"
    
    scripts:
      - name: Setup Firebase
        script: |
          mkdir -p android/app
          echo $FIREBASE_CONFIG | base64 --decode > android/app/google-services.json
      
      - name: Install packages
        script: |
          flutter pub get
          echo "Packages installed"
      
      - name: Build APK
        script: |
          flutter clean
          flutter build apk --release
      
      - name: Check APK
        script: |
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "✅ APK built: build/app/outputs/flutter-apk/app-release.apk"
          else
            echo "❌ No APK found"
          fi
    
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
