workflows:
  speedwash-android:
    name: SpeedWash APK
    environment:
      groups:
        - firebase_credentials
      flutter: stable
    
    scripts:
      - name: Setup Firebase
        script: |
          mkdir -p android/app
          echo $FIREBASE_CONFIG | base64 --decode > android/app/google-services.json
      
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --release
          echo "APK built at: build/app/outputs/flutter-apk/app-release.apk"
          ls -la build/app/outputs/flutter-apk/
    
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
