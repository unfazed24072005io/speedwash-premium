workflows:
  speedwash-android:
    name: SpeedWash APK
    environment:
      groups:
        - firebase_credentials
      flutter: "3.22.0"
    
    scripts:
      - name: Setup Firebase
        script: |
          mkdir -p android/app
          echo $FIREBASE_CONFIG | base64 --decode > android/app/google-services.json
      
      - name: Force v2 embedding
        script: |
          # Add v2 embedding flag
          echo "flutterEmbedding=2" >> android/local.properties
      
      - name: Build APK with v2
        script: |
          flutter pub get
          flutter build apk --release --no-shrink
      
      - name: Verify APK
        script: |
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "✅ APK built successfully!"
            cp build/app/outputs/flutter-apk/app-release.apk ./speedwash.apk
            echo "📱 APK size: $(du -h speedwash.apk | cut -f1)"
          else
            echo "❌ APK not found!"
            find . -name "*.apk" -type f
          fi
    
    artifacts:
      - speedwash.apk
      - build/app/outputs/flutter-apk/*.apk
