workflows:
  speedwash-android:
    name: SpeedWash Android APK
    environment:
      groups:
        - firebase_credentials
      vars:
        PACKAGE_NAME: "com.speedwash.premium"
      flutter: stable
    scripts:
      - name: Setup Firebase
        script: |
          mkdir -p android/app
          echo $FIREBASE_CONFIG | base64 --decode > android/app/google-services.json
          echo "✅ Firebase config created"
      - name: Install dependencies
        script: |
          flutter pub get
          echo "✅ Dependencies installed"
      - name: Build Android APK
        script: |
          flutter build apk \
            --release \
            --no-shrink
          echo "✅ APK built successfully"
      - name: Verify APK
        script: |
          ls -la build/app/outputs/flutter-apk/
          echo "📱 APK size: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - sutirthasoor7@gmail.com
      slack:
        channel: '#builds'
        notify_on_build_start: true

