name: speedwash_premium
description: SpeedWash Premium Car Wash App
version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.14.0
  firebase_auth: ^4.7.0
  cloud_firestore: ^4.8.0
  firebase_messaging: ^14.7.0
  
  # Payments
  razorpay_flutter: ^1.3.2
  
  # Location
  geolocator: ^10.1.0
  
  # Permissions
  permission_handler: ^10.4.0
  
  # URL Launcher
  url_launcher: ^6.1.11
  
  # Share
  share_plus: ^7.0.0
  
  # Vibration
  vibration: ^1.7.5-nullsafety.0
  
  # Date/Time
  intl: ^0.18.1
  
  # UI
  google_fonts: ^4.0.4
  carousel_slider: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf