name: speedwash_premium
description: SpeedWash Premium Car Wash App
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.6.0 <4.0.0"  # ✅ Changed from 3.0.0 to 3.6.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.4
  
  # Payments
  razorpay_flutter: ^1.4.0
  
  # Location
  geolocator: ^14.0.2
  
  # Permissions
  permission_handler: ^12.0.1
  
  # URL Launcher - VERSION FIXED
  url_launcher: ^6.1.5  # ✅ Compatible with Dart 3.4.0
  
  # Share
  share_plus: ^7.0.0  # ✅ Older compatible version
  
  # Vibration
  vibration: ^1.9.0  # ✅ Older compatible version
  
  # Date/Time
  intl: ^0.18.1  # ✅ Older compatible version

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0  # ✅ Older version

flutter:
  uses-material-design: true
