name: speedwash_premium
description: SpeedWash Premium Car Wash App
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - LATEST VERSIONS
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.4
  
  # Payments
  razorpay_flutter: ^1.4.0
  
  # Location
  geolocator: ^14.0.2
  
  # Permissions
  permission_handler: ^12.0.1
  
  # URL Launcher
  url_launcher: ^6.3.2
  
  # Share
  share_plus: ^12.0.1
  
  # Vibration
  vibration: ^3.1.4
  
  # Date/Time
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
